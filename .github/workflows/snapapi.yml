name: snapapi

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Lint sample suites
        run: python -m snapapi lint tests/test_suite.snaptest tests/recommended.snaptest tests/fixtures/offline.snaptest
      - name: Replay offline fixture
        run: python -m snapapi run tests/fixtures/offline.snaptest --mode replay --report html:report.html
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapapi-report
          path: report.html
          if-no-files-found: ignore
