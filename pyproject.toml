[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snapapi"
version = "0.3.0"
description = "Lightweight DSL for HTTP API testing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Deekshith Poojary" }]
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "jsonschema>=4.18.0",
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
snapapi = "snapapi.cli:entry"

[project.urls]
Homepage = "https://github.com/Deekshith-07/snapapi"

[tool.setuptools.packages.find]
include = ["snapapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
