[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pysnapapi"
version = "0.5.0"
description = "Lightweight DSL for HTTP API testing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    {name = "Deekshith Poojary", email = "deekshithpoojary355@gmail.com"}
]
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "jsonschema>=4.18.0",
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
watch = ["watchdog>=2.1"]

[project.scripts]
snapapi = "snapapi.cli:entry"

[project.entry-points.pytest11]
snapapi = "snapapi.pytest_plugin"

[project.urls]
Homepage = "https://deekshith-poojary98.github.io/snapapi/"
Documentation = "https://github.com/deekshith-poojary98/snapapi#readme"
Repository = "https://github.com/deekshith-poojary98/snapapi"
Issues = "https://github.com/deekshith-poojary98/snapapi/issues"

[tool.setuptools.packages.find]
include = ["snapapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:snapapi"
